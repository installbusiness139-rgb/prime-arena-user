<!DOCTYPE html>
<html>
<head>
<title>My Wallet - Prime Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e27;color:white;font-family:'Arial',sans-serif;padding-bottom:80px;min-height:100vh}
.topbar{display:flex;align-items:center;padding:15px;background:#0d1230;position:sticky;top:0;z-index:100;gap:15px}
.back-btn{font-size:24px;color:white;cursor:pointer}
.topbar-title{font-size:18px;font-weight:bold}
.main-balance{text-align:center;padding:30px 20px}
.balance-label{font-size:14px;color:#ccc;margin-bottom:15px}
.balance-amount{display:flex;justify-content:center;align-items:center;gap:10px}
.coin-big{font-size:45px}
.balance-number{font-size:48px;font-weight:bold;color:white}
.balance-number.loading{color:#888;font-size:32px}
.balance-cards{display:flex;justify-content:space-around;gap:10px;padding:0 15px 25px}
.balance-card{flex:1;background:white;border-radius:12px;padding:15px 10px;text-align:center}
.balance-card-icon{font-size:20px;margin-bottom:5px}
.balance-card-value{font-size:20px;font-weight:bold;color:#0a0e27;margin-bottom:3px}
.balance-card-value.loading{color:#888;font-size:14px}
.balance-card-label{font-size:11px;color:#666}
.action-row{display:flex;gap:10px;padding:0 15px 12px}
.action-btn{flex:1;background:white;border-radius:12px;padding:20px 8px;text-align:center;cursor:pointer;transition:transform .2s}
.action-btn:active{transform:scale(.95)}
.action-icon{width:55px;height:55px;background:linear-gradient(135deg,#ff6b00,#ffa500);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:26px;margin:0 auto 10px}
.action-label{font-size:12px;color:#0a0e27;font-weight:bold;line-height:1.3}
.redeem-row{padding:0 15px 25px}
.redeem-btn{background:linear-gradient(135deg,#6a1b9a,#8e24aa);border-radius:12px;padding:18px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:15px;transition:transform .2s;border:1px solid #ffa500;box-shadow:0 4px 15px rgba(106,27,154,.4)}
.redeem-btn:active{transform:scale(.97)}
.redeem-icon{width:50px;height:50px;background:linear-gradient(135deg,#ff6b00,#ffa500);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:24px;flex-shrink:0}
.redeem-text{text-align:left;flex:1}
.redeem-title{font-size:15px;color:white;font-weight:bold;margin-bottom:3px}
.redeem-sub{font-size:11px;color:#e0b0ff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d1230;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #2a2f4a;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#666;font-size:11px;padding:5px 10px}
.nav-item.active{color:#ffa500}
.nav-icon{font-size:22px}
</style>
</head>
<body>
<div class="topbar">
<div class="back-btn" onclick="location.href='home.html'">←</div>
<div class="topbar-title">My Wallet</div>
</div>

<div class="main-balance">
<div class="balance-label">Total Balance</div>
<div class="balance-amount">
<span class="coin-big">🪙</span>
<span class="balance-number loading" id="totalBalance">...</span>
</div>
</div>

<div class="balance-cards">
<div class="balance-card">
<div class="balance-card-icon">💰</div>
<div class="balance-card-value loading" id="depositedBalance">...</div>
<div class="balance-card-label">Deposited</div>
</div>
<div class="balance-card">
<div class="balance-card-icon">🏆</div>
<div class="balance-card-value loading" id="winningBalance">...</div>
<div class="balance-card-label">Winning</div>
</div>
</div>

<div class="action-row">
<div class="action-btn" onclick="location.href='recharge.html'">
<div class="action-icon">💳</div>
<div class="action-label">Add Coins</div>
</div>
<div class="action-btn" onclick="location.href='withdraw.html'">
<div class="action-icon">💸</div>
<div class="action-label">Withdraw<br>Coins</div>
</div>
<div class="action-btn" onclick="location.href='transactions.html'">
<div class="action-icon">📋</div>
<div class="action-label">Transactions</div>
</div>
</div>

<div class="redeem-row">
<div class="redeem-btn" onclick="location.href='withdraw.html#redeem'">
<div class="redeem-icon">🎁</div>
<div class="redeem-text">
<div class="redeem-title">Redeem Free Fire Code</div>
<div class="redeem-sub">Coins को redeem code में बदलो</div>
</div>
<div style="font-size:22px;color:#ffa500">›</div>
</div>
</div>

<div class="bottom-nav">
<div class="nav-item" onclick="location.href='tournaments.html'"><span class="nav-icon">🎮</span><span>Tournaments</span></div>
<div class="nav-item" onclick="location.href='leaderboard.html'"><span class="nav-icon">🏆</span><span>Leaderboard</span></div>
<div class="nav-item" onclick="location.href='home.html'"><span class="nav-icon">🏠</span><span>Home</span></div>
<div class="nav-item active" onclick="location.href='wallet.html'"><span class="nav-icon">💰</span><span>Wallet</span></div>
<div class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span><span>Profile</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",
authDomain: "prime-arena-a302b.firebaseapp.com",
projectId: "prime-arena-a302b",
storageBucket: "prime-arena-a302b.firebasestorage.app",
messagingSenderId: "118236794000",
appId: "1:118236794000:web:cd0e5bf7503b72f1cf5c15",
measurementId: "G-EQJP1D9C92"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

var user = {};
try {
user = JSON.parse(localStorage.getItem('primeArenaUser') || '{}');
} catch(e) {
user = {};
}

if (!user.id) {
location.href = 'login.html';
}

async function loadWallet() {
var totalEl = document.getElementById('totalBalance');
var depositedEl = document.getElementById('depositedBalance');
var winningEl = document.getElementById('winningBalance');

try {
const userDocRef = doc(db, "users", user.id);
const userDocSnap = await getDoc(userDocRef);

if (userDocSnap.exists()) {
var data = userDocSnap.data();
var balance = data.balance || 0;
var deposited = data.deposited || 0;
var winning = data.winning || 0;

totalEl.textContent = balance;
totalEl.classList.remove('loading');
depositedEl.textContent = deposited;
depositedEl.classList.remove('loading');
winningEl.textContent = winning;
winningEl.classList.remove('loading');

user.balance = balance;
user.deposited = deposited;
user.winning = winning;
try {
localStorage.setItem('primeArenaUser', JSON.stringify(user));
} catch(e) {}
} else {
totalEl.textContent = '0';
totalEl.classList.remove('loading');
depositedEl.textContent = '0';
depositedEl.classList.remove('loading');
winningEl.textContent = '0';
winningEl.classList.remove('loading');
}
} catch (error) {
console.error("Error loading wallet:", error);
if (totalEl.classList.contains('loading')) {
totalEl.textContent = '0';
totalEl.classList.remove('loading');
depositedEl.textContent = '0';
depositedEl.classList.remove('loading');
winningEl.textContent = '0';
winningEl.classList.remove('loading');
}
}
}

loadWallet();
</script>
<script type="module" src="ban-check.js"></script>
</body>
  </html>
