<!DOCTYPE html>
<html>
<head>
<title>Prime Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e27;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
.splash-container{text-align:center;animation:fadeIn 1.5s ease-in-out}
.logo-box{width:120px;height:120px;background:linear-gradient(135deg,#ff6b00,#ffa500);border-radius:25px;display:flex;justify-content:center;align-items:center;margin:0 auto 20px;box-shadow:0 0 30px rgba(255,165,0,.6)}
.logo-box img{width:100px;height:100px;border-radius:20px}
.app-name{font-size:32px;font-weight:bold;color:#ffa500;letter-spacing:3px;margin-bottom:10px}
.tagline{font-size:14px;color:#ccc;letter-spacing:1px;margin-bottom:40px}
.loading-bar{width:200px;height:4px;background:#1a1f3a;border-radius:2px;margin:0 auto;overflow:hidden}
.loading-fill{width:0%;height:100%;background:linear-gradient(90deg,#ff6b00,#ffa500);border-radius:2px;animation:loading 3s ease-in-out forwards}
@keyframes loading{0%{width:0%}100%{width:100%}}
@keyframes fadeIn{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="splash-container">
<div class="logo-box">
<img src="images/logo.png" alt="Prime Arena Logo">
</div>
<div class="app-name">PRIME ARENA</div>
<div class="tagline">INDIA'S ULTIMATE FREE FIRE ARENA</div>
<div class="loading-bar">
<div class="loading-fill"></div>
</div>
</div>

<script>
setTimeout(function(){
// User पहले से logged in है क्या?
var user = {};
try {
user = JSON.parse(localStorage.getItem('primeArenaUser') || '{}');
} catch(e) {
user = {};
}

if (user && user.id) {
// Logged in → सीधे Home भेजो
window.location.href = 'home.html';
} else {
// नहीं है → Login page पर भेजो
window.location.href = 'login.html';
}
}, 3000);
</script>
</body>
</html>
