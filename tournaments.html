<!DOCTYPE html>
<html>
<head>
  <title>Tournaments - Prime Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e27; color: white; font-family: 'Arial', sans-serif; padding-bottom: 80px; min-height: 100vh; }
    .topbar { display: flex; align-items: center; padding: 15px; background: #0d1230; position: sticky; top: 0; z-index: 100; gap: 15px; }
    .back-btn { font-size: 24px; color: white; cursor: pointer; }
    .topbar-title { font-size: 18px; font-weight: bold; color: white; }
    .tabs { display: flex; background: #0d1230; padding: 0 15px; gap: 10px; overflow-x: auto; border-bottom: 1px solid #2a2f4a; }
    .tab { padding: 12px 20px; font-size: 13px; font-weight: bold; color: #666; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
    .tab.active { color: #ffa500; border-bottom: 3px solid #ffa500; }
    .tournament-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
    .tournament-card { background: #1a1f3a; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #2a2f4a; transition: transform 0.2s; }
    .tournament-card:active { transform: scale(0.97); }
    .card-banner { width: 100%; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #ff6b00, #ffa500); display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; color: #0a0e27; position: relative; overflow: hidden; }
    .card-banner img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .card-badge { position: absolute; top: 6px; right: 6px; background: #ff3131; color: white; font-size: 9px; padding: 3px 7px; border-radius: 8px; font-weight: bold; z-index: 2; }
    .card-info { padding: 10px; }
    .card-title { font-size: 12px; font-weight: bold; color: white; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-details { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; }
    .card-entry { color: #ffa500; font-weight: bold; }
    .empty-state { text-align: center; padding: 60px 20px; color: #666; grid-column: 1 / -1; }
    .empty-icon { font-size: 60px; margin-bottom: 15px; opacity: 0.5; }
    .empty-text { font-size: 15px; margin-bottom: 5px; }
    .empty-subtext { font-size: 12px; color: #444; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0d1230; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #2a2f4a; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: #666; font-size: 11px; padding: 5px 10px; }
    .nav-item.active { color: #ffa500; }
    .nav-icon { font-size: 22px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="back-btn" onclick="window.location.href='home.html'">←</div>
    <div class="topbar-title">TOURNAMENTS</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="filterMode('all', this)">All</div>
    <div class="tab" onclick="filterMode('Solo', this)">Solo</div>
    <div class="tab" onclick="filterMode('Duo', this)">Duo</div>
    <div class="tab" onclick="filterMode('Squad', this)">Squad</div>
  </div>

  <div class="tournament-grid" id="tournamentGrid">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <div class="empty-text">Loading matches...</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="window.location.href='tournaments.html'"><span class="nav-icon">🎮</span><span>Tournaments</span></div>
    <div class="nav-item" onclick="window.location.href='leaderboard.html'"><span class="nav-icon">🏆</span><span>Leaderboard</span></div>
    <div class="nav-item" onclick="window.location.href='home.html'"><span class="nav-icon">🏠</span><span>Home</span></div>
    <div class="nav-item" onclick="window.location.href='wallet.html'"><span class="nav-icon">💰</span><span>Wallet</span></div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><span class="nav-icon">👤</span><span>Profile</span></div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",
      authDomain: "prime-arena-a302b.firebaseapp.com",
      projectId: "prime-arena-a302b",
      storageBucket: "prime-arena-a302b.firebasestorage.app",
      messagingSenderId: "118236794000",
      appId: "1:118236794000:web:cd0e5bf7503b72f1cf5c15",
      measurementId: "G-EQJP1D9C92"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    var db = firebase.firestore();
    var currentFilter = 'all';
    var allMatches = [];

    function loadMatches() {
      db.collection("matches").get().then(function(querySnapshot) {
        allMatches = [];
        querySnapshot.forEach(function(doc) {
          var data = doc.data();
          data.id = doc.id;
          allMatches.push(data);
        });
        allMatches.sort(function(a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
        displayMatches();
      }).catch(function(error) {
        document.getElementById('tournamentGrid').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">Error: ' + error.message + '</div></div>';
      });
    }

    function displayMatches() {
      var grid = document.getElementById('tournamentGrid');
      var filtered = allMatches.filter(function(m) {
        if (currentFilter === 'all') return true;
        return m.mode === currentFilter;
      });
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🎮</div><div class="empty-text">No Matches Available</div><div class="empty-subtext">Check back later!</div></div>';
        return;
      }
      var html = '';
      filtered.forEach(function(m) {
        var statusBadge = '';
        if (m.status === 'live') statusBadge = '<span class="card-badge">LIVE</span>';
        else if (m.status === 'upcoming') statusBadge = '<span class="card-badge">UPCOMING</span>';
        var bannerContent = m.bannerUrl ? '<img src="' + m.bannerUrl + '" onerror="this.style.display=\'none\'">' : '';
        html += '<div class="tournament-card" onclick="openMatch(\'' + m.id + '\')">' +
          '<div class="card-banner">' + bannerContent + statusBadge + '</div>' +
          '<div class="card-info">' +
            '<div class="card-title">' + m.title + '</div>' +
            '<div class="card-details">' +
              '<span>Entry: ' + m.entryFee + '</span>' +
              '<span class="card-entry">' + m.prizePool + ' coins</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
      grid.innerHTML = html;
    }

    function filterMode(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.tab').forEach(function(tab) { tab.classList.remove('active'); });
      el.classList.add('active');
      displayMatches();
    }

    // ✅ यहाँ बदलाव: अब ID localStorage और URL दोनों में भेजेंगे
    function openMatch(id) {
      try { localStorage.setItem('selectedMatchId', id); } catch(e) {}
      window.location.href = 'match-details.html?id=' + encodeURIComponent(id);
    }

    loadMatches();
  </script>
</body>
</html>
